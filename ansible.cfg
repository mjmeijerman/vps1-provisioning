[defaults]
inventory = hosts
roles_path = roles-galaxy:roles:roles-per-project
legacy_playbook_variables = False
retry_files_enabled = False
interpreter_python = /usr/bin/python3

# Print the slowest tasks when a run ends. Without it, "provisioning is slow"
# is a feeling, and every optimisation is a guess.
callbacks_enabled = profile_tasks

# Both plays target the same host, so the facts are gathered twice per run and
# again on every iteration while testing. Cached for half an hour; a reprovision
# after a reboot gets fresh ones.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible/facts
fact_caching_timeout = 1800

# The user directory comes first so `make update-ansible-roles` can install
# into it without root; the distro path is the fallback for a machine that
# already had the collections. Without both, ansible.posix and community.mysql
# do not resolve and the playbook fails on the first acl task.
collections_path = ~/.ansible/collections:/usr/lib/python3/dist-packages/ansible_collections:/usr/share/ansible/collections

[ssh_connection]
pipelining = True
# Setting ssh_args replaces Ansible's default rather than adding to it, and that
# default is what enables connection multiplexing. Spelled out here: one SSH
# connection for the whole play instead of one per task, and this play has 253
# of them. ForwardAgent stays, a checkout on the host may need the key.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ForwardAgent=yes
# Ansible adds ControlPath itself once multiplexing is on; this is the directory
# those sockets live in.
control_path_dir = ~/.ansible/cp
