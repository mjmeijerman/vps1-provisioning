[defaults]
inventory = hosts
roles_path = roles-galaxy:roles:roles-per-project
legacy_playbook_variables = False
retry_files_enabled = False
interpreter_python = /usr/bin/python3

# Collections installed by the distro package land here; without this a fresh
# shell cannot resolve ansible.posix / community.mysql and the playbook fails
# on the first acl or authorized_key task.
collections_path = /usr/lib/python3/dist-packages/ansible_collections:~/.ansible/collections:/usr/share/ansible/collections

[ssh_connection]
pipelining = True
ssh_args = -o ForwardAgent=yes
