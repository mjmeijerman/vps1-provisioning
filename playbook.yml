---
- name: Provision vps1.markmeijerman.nl
  hosts: all
  remote_user: "{{ ssh_provision_user }}"
  become: true

  roles:
    # Owns the sury apt source before anything touches the apt cache. Every
    # role before it that runs `apt update` fails on a box whose sury source
    # is defined twice, which is exactly what f500.php8 used to leave behind.
    - php_sury_repo
    - f500.debian
    - install_apt_packages
    - f500.bashrc
    - HanXHX.mysql
    - f500.nginx
    - f500.locale
    - f500.ufw
    - f500.memcached
    - f500.php8
    - f500.php_composer
    - install_docker
    - mail_server
    - logging
    - f500.vim

  tasks:
    - name: Write custom mariadb conf file
      ansible.builtin.template:
        src: my.cnf.j2
        dest: /etc/mysql/mariadb.conf.d/90-my.cnf
        owner: root
        group: mysql
        # The MariaDB config is world-readable on Debian; match that, and say
        # it out loud so a reprovision cannot silently widen it.
        mode: "0644"

    - name: Copy logrotate configuration
      ansible.builtin.copy:
        src: "logrotate-nginx"
        dest: "/etc/logrotate.d/nginx"
        mode: "0644"

    # f500.php8 adds the deb.sury.org source itself, without signed-by, and
    # does it after php_sury_repo has cleaned up. Left alone, apt reads the same
    # repository twice, warns about it on every call, and downloads the index
    # twice. The role that owns the source owns the file, so drop the copy the
    # other one wrote.
    - name: Remove the unsigned deb.sury.org source that f500.php8 re-adds
      ansible.builtin.file:
        # Exactly the file f500.php8 / apt_repository writes. Not
        # php_sury_repo_other_files: that list also holds /etc/apt/sources.list,
        # and deleting Debian's own source list would leave the box with no
        # repository at all.
        path: /etc/apt/sources.list.d/packages_sury_org_php.list
        state: absent

- name: Production roles
  hosts: "production"
  remote_user: "{{ ssh_provision_user }}"
  become: true

  roles:
    - webserver
    - geerlingguy.certbot
    - lets_encrypt
