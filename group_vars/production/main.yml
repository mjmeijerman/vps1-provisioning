---

deploy_user: deploy
project_root: /home/{{ deploy_user }}
bashrc_users:
  - "provision"

ssh_provision_user: "provision"

# NGINX
nginx_user: www-data
nginx_group: www-data
# Everything that needs a vhost and a certificate: redirects, static/PHP sites,
# and reverse proxies. A list added here but not aggregated is silently ignored
# by both the nginx and the lets_encrypt tasks.
server_templates: >-
  {{ nginx_server_templates_redirects
     + nginx_server_templates_websites
     + nginx_server_templates_proxies | default([]) }}

nginx_server_templates_redirects:
  - name: "markmeijerman.nl"
    src: "{{ inventory_dir }}/roles/webserver/templates/redirect.conf.j2"
    redirect_to: "https://www.linkedin.com/in/mjmeijerman/"
    domains:
      - "markmeijerman.nl"
      - "www.markmeijerman.nl"
  # Same destination as .nl; both TLDs are delegated to the same nameservers
  # and already resolve to this host.
  - name: "markmeijerman.eu"
    src: "{{ inventory_dir }}/roles/webserver/templates/redirect.conf.j2"
    redirect_to: "https://www.linkedin.com/in/mjmeijerman/"
    domains:
      - "markmeijerman.eu"
      - "www.markmeijerman.eu"
  - name: "instachick.nl"
    src: "{{ inventory_dir }}/roles/webserver/templates/redirect.conf.j2"
    redirect_to: "https://www.instachicks.nl"
    domains:
      - "instachick.nl"
      - "www.instachick.nl"
  - name: "instachicks.nl"
    src: "{{ inventory_dir }}/roles/webserver/templates/redirect.conf.j2"
    redirect_to: "https://www.youtube.com/live/0mu44BseQQo"
    domains:
      - "instachicks.nl"
      - "www.instachicks.nl"

nginx_http_params:
  client_max_body_size: "8M"
  ssl_protocols: TLSv1.3

# UFW
ufw_default_policy:
  - { direction: "incoming", policy: "deny" }

ufw_rules_to_create:
  - to_port: 22 # ssh
    rule: allow
  - to_port: 80 # Nginx
    rule: allow
  - to_port: 443 # Nginx
    rule: allow
  # Containers reach services on this host over the docker bridge, and ufw's
  # default incoming policy drops that traffic: the app could not open port 25
  # and every signup failed to send. Scoped to the private bridge range, so the
  # internet still cannot reach these ports; 25 in particular stays closed from
  # outside.
  - rule: allow
    interface: docker0
    direction: in
  - rule: allow
    interface: br-+
    direction: in

# PHP

php8_ini_directives_global:
  disable_functions: "exec, passthru, system, popen"
  allow_url_fopen: 1
  session.save_path: "/var/lib/php{{ php8_version }}/sessions"
  session.cookie_secure: 1
  session.gc_probability: 1
  session.gc_divisor: 1000
  session.gc_maxlifetime: 3600
  always_populate_raw_post_data: "-1"

  opcache_fast_shutdown: 0
  opcache_interned_strings_buffer: 16
  opcache_max_accelerated_files: 10240
  opcache_memory_consumption: 128
  opcache_revalidate_freq: 0
  opcache_validate_timestamps: 0

  error_log: syslog

php8_ini_directives_fpm:
  upload_max_filesize: "8M"
  post_max_size: "8M"

php8_fpm_pool_enabled: true
php8_fpm_pool_name: www
php8_fpm_pool_user: www-data
php8_fpm_pool_group: www-data
php8_fpm_pool_listen: "/run/php/php{{ php8_version }}-fpm.sock"
php8_fpm_pool_listen_mode: "0660"
php8_fpm_pool_pm: static
php8_fpm_pool_status_path: /status
php8_fpm_pool_pm_max_children: 128
php8_fpm_pool_pm_max_requests: 512
php8_fpm_pool_catch_workers_output: true

# MYSQL
mariadb_bind_address: "127.0.0.1"
mariadb_root_password: ~ # Placed in secure.yml

mariadb_databases:
  - "{{ mariadb_databases_websites }}"
mariadb_users: "{{ mariadb_users_websites }}"
