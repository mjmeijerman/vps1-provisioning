websites_root: /home/websites

# Bakmark runs in Docker and publishes on loopback only; nginx is its public
# door. The app reads X-Forwarded-* from these hosts (astro.config.mjs
# allowedDomains), so the Host header has to be the real one, which is why the
# proxy passes $host rather than a rewritten name.
bakmark_staging_port: 8090

nginx_server_templates_proxies:
  - name: bakmark-staging
    domains:
      - "staging.bakmark.nl"
    src: "{{ inventory_dir }}/roles/webserver/templates/proxy-https.conf.j2"
    proxy_pass: "127.0.0.1:{{ bakmark_staging_port }}"
    headers:
      # The theme toggle runs from an inline <script is:inline> in the layout,
      # so script-src needs 'unsafe-inline'. Everything else stays closed.
      Content-Security-Policy: >-
        default-src 'self'; script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline'; img-src 'self' data:;
        font-src 'self'; frame-ancestors 'none'; base-uri 'self'
      X-Content-Type-Options: nosniff
      Referrer-Policy: no-referrer
      X-Frame-Options: DENY
    # The signup endpoint caps its own body at 64 KiB; let nginx agree instead
    # of rejecting first with its own 413.
    client_max_body_size: "64k"

