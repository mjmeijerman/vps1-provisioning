---
- name: Install snapd
  ansible.builtin.package:
    name: snapd
    state: present

- name: Enable and start snapd
  ansible.builtin.systemd:
    name: snapd.socket
    enabled: true
    state: started

- name: Enable classic snap support
  ansible.builtin.file:
    src: /var/lib/snapd/snap
    dest: /snap
    state: link
  when: ansible_os_family != "Debian"

- name: Make sure snap has a current core
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      snap install core
      snap refresh core
    executable: /bin/bash
  changed_when: false
  failed_when: false

- name: Install certbot from snap
  community.general.snap:
    name: certbot
    classic: true

- name: Symlink certbot into place
  ansible.builtin.file:
    src: /snap/bin/certbot
    dest: /usr/bin/certbot
    state: link
  ignore_errors: "{{ ansible_check_mode }}"

- name: Point the certificate tasks at the snap binary
  ansible.builtin.set_fact:
    certbot_script: /usr/bin/certbot
