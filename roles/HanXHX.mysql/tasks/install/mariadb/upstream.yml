---

- name: Check whether the repository is already set up for this version
  ansible.builtin.command:
    cmd: grep -q "{{ mariadb_upstream_version }}" /etc/apt/sources.list.d/mariadb.list
  register: mariadb_upstream_repository
  failed_when: false
  changed_when: false

- name: Set up the MariaDB upstream repository
  when: mariadb_upstream_repository.rc > 0
  block:
    - name: Download the MariaDB setup script
      ansible.builtin.get_url:
        url: "{{ mariadb_upstream_setup_script }}"
        dest: /tmp/mariadb_repo_setup
        mode: "0755"
        owner: root
        group: root

    - name: Run the MariaDB setup script
      ansible.builtin.command:
        cmd: "/tmp/mariadb_repo_setup --mariadb-server-version={{ mariadb_upstream_version }}"
      changed_when: true

    - name: Remove the setup script
      ansible.builtin.file:
        path: /tmp/mariadb_repo_setup
        state: absent

- name: Remove the backups apt keeps of the old source file
  ansible.builtin.command:
    cmd: rm -f /etc/apt/sources.list.d/mariadb.list.old_1
  changed_when: false
