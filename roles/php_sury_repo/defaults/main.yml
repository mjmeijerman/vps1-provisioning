---

php_sury_repo_url: https://packages.sury.org/php/
php_sury_repo_key_url: https://packages.sury.org/php/apt.gpg
php_sury_repo_keyring_dir: /usr/share/keyrings
php_sury_repo_keyring: "{{ php_sury_repo_keyring_dir }}/sury-keyring.gpg"

# Where our own definition lives. Deliberately different from the filename
# f500.php8 generates (packages_sury_org_php.list), so the two can never end up
# in the same file as conflicting lines.
php_sury_repo_source_path: /etc/apt/sources.list.d/sury-php.list

# Every file that could hold a competing definition of the same source.
php_sury_repo_other_files:
  - /etc/apt/sources.list
  - /etc/apt/sources.list.d/packages_sury_org_php.list
