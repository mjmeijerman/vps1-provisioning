---

# The host that owns the PTR and appears in Received headers. Must match the
# reverse DNS record, or receiving servers dislike the connection before they
# read a word of it.
mail_server_hostname: mail.bakmark.nl
mail_server_public_ip: 5.79.100.71

# D6: mail goes out as news.<domain>, so reputation damage lands on a
# subdomain instead of the one that serves the site.
mail_server_dkim_domain: news.bakmark.nl
mail_server_dkim_selector: default
mail_server_dkim_bits: 2048

# Where the reports in the DMARC record go.
mail_server_dmarc_report: hello@bakmark.nl

mail_server_opendkim_key_dir: /etc/opendkim/keys/{{ mail_server_dkim_domain }}

# A unix socket is invisible inside Postfix's chroot, and cleanup/smtp are
# chrooted by default: the milter looked present on the host and missing from
# inside the jail, so every message went out unsigned. A loopback TCP listener
# has no such problem, and Postfix documents it for exactly this case.
mail_server_milter_host: 127.0.0.1
mail_server_milter_port: 8891
# The two programs spell the same socket differently, and neither accepts the
# other's form:
#   OpenDKIM  inet:PORT@HOST   — libmilter's own syntax; `inet:HOST:PORT`
#                                fails with a bare smfi_opensocket() error
#   Postfix   inet:HOST:PORT   — `inet:PORT@HOST` dies with
#                                "garbage after numerical service"
mail_server_milter_listen: inet:{{ mail_server_milter_port }}@{{ mail_server_milter_host }}
mail_server_milter: inet:{{ mail_server_milter_host }}:{{ mail_server_milter_port }}

# Only these may relay: this machine, and the docker bridge the containers sit
# on. 172.16/12 rather than one address, because the bridge changes when Docker
# is restarted.
# IPv6 addresses MUST be bracketed. `::1/128` is parsed as a dictionary
# reference ("type:name") and smtpd refuses to start with
#   fatal: open dictionary: expecting "type:name" form instead of "::1/128"
mail_server_networks:
  - 127.0.0.0/8
  - "[::1]/128"
  - 172.16.0.0/12

# Anything larger is not a newsletter confirmation.
mail_server_message_size_limit: 10240000

# Where the role checks that smtpd answers. Loopback, because the check runs on
# the host that runs Postfix.
mail_server_banner_host: 127.0.0.1
