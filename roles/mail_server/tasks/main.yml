---
# Postfix + OpenDKIM: the smallest thing that sends properly signed mail from
# our own IP.
#
# Per D6 in the bakmark plan: no ESP, no relay, our SPF and our DKIM key. The
# application on this box sends through this Postfix on 127.0.0.1:25.
#
# What this role does NOT do: set SPF, DMARC or the DKIM DNS record. Those live
# at the registrar, and a playbook that silently depended on them would look
# healthy while every mail landed in spam. The exact records to publish are in
# README (Mail) and are printed by the role.

# Answer Postfix's own questions before it is installed: unattended, the
# package still prompts on a tty and hangs a non-interactive run.
- name: Preseed the Postfix package questions
  ansible.builtin.debconf:
    name: postfix
    question: "{{ item.question }}"
    vtype: "{{ item.vtype }}"
    value: "{{ item.value }}"
  loop:
    - question: postfix/main_mailer_type
      vtype: select
      value: Internet Site
    - question: postfix/mailname
      vtype: string
      value: "{{ mail_server_hostname }}"
  loop_control:
    label: "{{ item.question }}"

- name: Install Postfix and OpenDKIM
  ansible.builtin.apt:
    name:
      - postfix
      - opendkim
      - opendkim-tools
      - mailutils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the OpenDKIM key directory
  ansible.builtin.file:
    path: "{{ mail_server_opendkim_key_dir }}"
    state: directory
    owner: opendkim
    group: opendkim
    mode: "0750"

# The key is generated once and never regenerated: rotating it means a DNS
# change and a window where signatures fail, so it must not happen because a
# playbook ran again.
- name: Check for an existing DKIM key
  ansible.builtin.stat:
    path: "{{ mail_server_opendkim_key_dir }}/{{ mail_server_dkim_selector }}.private"
    get_checksum: false
  register: mail_server_dkim_key

- name: Generate the DKIM key
  ansible.builtin.command:
    cmd: >-
      opendkim-genkey -b {{ mail_server_dkim_bits }} -s {{ mail_server_dkim_selector }}
      -d {{ mail_server_dkim_domain }} -D {{ mail_server_opendkim_key_dir }}
      -v
  when: not mail_server_dkim_key.stat.exists
  changed_when: not mail_server_dkim_key.stat.exists
  notify: Restart opendkim

- name: Hand the key to OpenDKIM
  ansible.builtin.file:
    path: "{{ mail_server_opendkim_key_dir }}/{{ mail_server_dkim_selector }}.private"
    owner: opendkim
    group: opendkim
    mode: "0600"

- name: Create the OpenDKIM runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: opendkim
    group: opendkim
    mode: "0755"
  loop:
    - /run/opendkim
    - /etc/opendkim/keys

- name: Write the OpenDKIM key table
  ansible.builtin.template:
    src: KeyTable.j2
    dest: /etc/opendkim/KeyTable
    owner: opendkim
    group: opendkim
    mode: "0640"
  notify: Restart opendkim

- name: Write the OpenDKIM signing table
  ansible.builtin.template:
    src: SigningTable.j2
    dest: /etc/opendkim/SigningTable
    owner: opendkim
    group: opendkim
    mode: "0640"
  notify: Restart opendkim

- name: Write the list of domains OpenDKIM will sign for
  ansible.builtin.template:
    src: TrustedHosts.j2
    dest: /etc/opendkim/TrustedHosts
    owner: opendkim
    group: opendkim
    mode: "0640"
  notify: Restart opendkim

# smtpd connects to the milter socket as the postfix user. The socket is
# opendkim:opendkim 0770, so without this membership every message logs
# "connect to Milter service ... Permission denied" and goes out unsigned.
- name: Add postfix to the opendkim group
  ansible.builtin.user:
    name: postfix
    groups: opendkim
    append: true
  notify: Restart opendkim

- name: Write the OpenDKIM configuration
  ansible.builtin.template:
    src: opendkim.conf.j2
    dest: /etc/opendkim.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart opendkim

# Postfix hands the message to OpenDKIM through a milter, then OpenDKIM signs
# on the way out.
# Some Postfix services still chroot; the ones that do look for the milter
# under /var/spool/postfix. A bind mount keeps both views identical.
- name: Create the milter directory inside the Postfix spool
  ansible.builtin.file:
    path: /var/spool/postfix/var/run/opendkim
    state: directory
    owner: opendkim
    group: opendkim
    mode: "0755"

- name: Write the Postfix main configuration
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: "0644"
  notify: Reload postfix

- name: Write the Postfix master configuration
  ansible.builtin.template:
    src: master.cf.j2
    dest: /etc/postfix/master.cf
    owner: root
    group: root
    mode: "0644"
  notify: Reload postfix

# master.cf is whitespace-sensitive: eight columns per service, and a missing
# one is read as a different setting rather than as an error. Postfix accepted
# a seven-column smtp line silently and then started no smtpd at all, so the
# port accepted connections and never answered.
- name: Validate the Postfix master configuration
  ansible.builtin.command:
    cmd: postconf -M
  register: mail_server_master_check
  changed_when: false
  failed_when: mail_server_master_check.rc != 0

# postfix.service on Debian is a stub: ExecStart=/bin/true, Type=oneshot, and it
# reports "active (exited)" whether or not a mail system runs. The real unit is
# postfix@-.service. Starting the stub alone leaves an empty port that accepts
# connections and never answers, which is what took three deploys to notice.
- name: Enable and start OpenDKIM
  ansible.builtin.systemd:
    name: opendkim
    enabled: true
    state: started

- name: Enable and start the Postfix instance
  ansible.builtin.systemd:
    name: "postfix@-"
    enabled: true
    state: restarted

# The only check that proves the mail system works: a banner on port 25. A
# "started" unit, an open socket and a listening port all looked healthy while
# nothing was there to answer.
# The three checks below run for real even in check mode. They only read, and
# skipped they register nothing: a dry run used to fail here with a banner
# assertion that had never been given a value.
- name: Wait for the SMTP banner
  check_mode: false
  ansible.builtin.wait_for:
    host: "{{ mail_server_banner_host }}"
    port: 25
    timeout: 30

# Read ONE line, not 64 bytes. `head -c 64` blocks until 64 bytes arrive, and
# the banner is about 25, so the playbook hangs instead of failing. The timeout
# covers the other direction: a server that accepts the connection and says
# nothing would hold this open just as long.
- name: Read the SMTP banner
  check_mode: false
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      exec 3<>/dev/tcp/{{ mail_server_banner_host }}/25
      timeout 5 head -1 <&3
    executable: /bin/bash
  register: mail_server_banner
  changed_when: false
  failed_when: "'220' not in mail_server_banner.stdout"
  # A timeout is slow, not a reason to retry.
  timeout: 20

- name: Refuse to report success without a working SMTP service
  check_mode: false
  ansible.builtin.assert:
    that:
      - "'220' in mail_server_banner.stdout"
    fail_msg: >-
      Postfix is running but smtpd did not answer. Check
      `journalctl -u postfix@-` for a fatal line: a malformed mynetworks entry
      and missing smtpd_relay_restrictions both stop smtpd from starting while
      the service still reports active.
    quiet: true

# Postfix must not be an open relay, and it must accept mail from the app.
# Checked here rather than assumed: a misconfigured mynetworks is how a VPS
# becomes a spam cannon within a day of being found.
- name: Verify Postfix is not an open relay
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      postconf -h mynetworks_style mynetworks | tr '\n' ' '
    executable: /bin/bash
  register: mail_server_mynetworks
  changed_when: false

- name: Report the DNS records this configuration expects
  ansible.builtin.debug:
    msg: |
      Publish these, or every mail lands in spam:
        TXT  {{ mail_server_dkim_selector }}._domainkey.{{ mail_server_dkim_domain }}  (content below)
        TXT  {{ mail_server_dkim_domain }}          "v=spf1 ip4:{{ mail_server_public_ip }} -all"
        TXT  _dmarc.{{ mail_server_dkim_domain }}   "v=DMARC1; p=none; rua=mailto:{{ mail_server_dmarc_report }}"
        PTR  {{ mail_server_public_ip }} -> {{ mail_server_hostname }}
      Postfix mynetworks: {{ mail_server_mynetworks.stdout }}
