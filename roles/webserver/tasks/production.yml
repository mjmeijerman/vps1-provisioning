---

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Set fail2ban to work with UFW
  ansible.builtin.template:
    src: fail2ban/jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

# The password hash stays exactly as it was: this task only ever sets it on
# the first run, and changing the string would lock the deploy user out.

- name: Create 'websites' user
  ansible.builtin.user:
    name: websites
    groups: www-data
    shell: /bin/bash

- name: Create website directories
  ansible.builtin.file:
    path: "/home/websites/{{ item }}"
    state: directory
    owner: websites
    group: websites
    mode: "0755"
  loop: "{{ nginx_server_templates_websites | pluck('name') | difference(['defaultssl']) | unique }}"

# A static site is pushed into its directory by the project's own deploy script,
# as the deploy account, with rsync --delete. So the directory has to exist here
# first, be owned by that account, and stay readable to nginx (group www-data,
# with the files arriving world-readable).
- name: Create static site directories
  ansible.builtin.file:
    path: "{{ item.web_root }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ nginx_group }}"
    mode: "0755"
  loop: "{{ nginx_server_templates_static | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Add composer file for wordpress cli
  ansible.builtin.template:
    src: "{{ inventory_dir }}/roles/webserver/templates/composer.json.j2"
    dest: /home/websites/composer.json
    owner: websites
    group: websites
    mode: "0644"

- name: Install wordpress cli using composer
  become: true
  become_user: websites
  ansible.builtin.command:
    cmd: composer update --working-dir=/home/websites
    creates: /home/websites/vendor/bin/wp

- name: Check to see if file exists
  ansible.builtin.stat:
    path: "/home/websites/{{ item.name }}/wp-config.php"
    get_checksum: false
  register: webserver_wp_config
  loop: "{{ nginx_server_templates_websites }}"

- name: Remove all files when wp-config file does not exist
  become: true
  become_user: websites
  ansible.builtin.shell:
    cmd: rm -rf /home/websites/{{ item.item.name }}/*
  loop: "{{ webserver_wp_config.results }}"
  # Deleting a tree cannot be idempotent; it only runs when wp-config.php is
  # already known to be absent, so reporting a change is honest here.
  changed_when: true
  when: not item.stat.exists

- name: Download wordpress core
  become: true
  become_user: websites
  ansible.builtin.command:
    cmd: >-
      /home/websites/vendor/bin/wp core download
      --path=/home/websites/{{ item.item.name }} --locale=nl_NL
    creates: "/home/websites/{{ item.item.name }}/wp-settings.php"
  loop: "{{ webserver_wp_config.results }}"
  when: not item.stat.exists

- name: Wordpress configuration
  become: true
  become_user: websites
  ansible.builtin.command:
    cmd: >-
      /home/websites/vendor/bin/wp core config
      --path=/home/websites/{{ item.item.name }}
      --dbname={{ item.item.db_name }} --dbuser={{ item.item.db_user }}
      --dbpass={{ item.item.db_password }} --dbhost=localhost
    creates: "/home/websites/{{ item.item.name }}/wp-config.php"
  loop: "{{ webserver_wp_config.results }}"
  when: not item.stat.exists
  no_log: true

- name: Wordpress configuration file permissions
  ansible.builtin.file:
    path: "/home/websites/{{ item.item.name }}/wp-config.php"
    mode: "0644"
  loop: "{{ webserver_wp_config.results }}"
  when: not item.stat.exists

- name: Wordpress core installation
  become: true
  become_user: websites
  ansible.builtin.command:
    cmd: >-
      /home/websites/vendor/bin/wp core install
      --path=/home/websites/{{ item.item.name }} --url={{ item.item.url }}
      --title={{ item.item.label | quote }}
      --admin_name={{ item.item.admin_username }}
      --admin_password={{ item.item.admin_password }}
      --admin_email={{ item.item.admin_email }}
  loop: "{{ webserver_wp_config.results }}"
  when: not item.stat.exists
  changed_when: true
  no_log: true

- name: Disable the JSON api
  become: true
  become_user: websites
  ansible.builtin.command:
    cmd: >-
      /home/websites/vendor/bin/wp plugin install disable-json-api --activate
      --path=/home/websites/{{ item.item.name }}
  loop: "{{ webserver_wp_config.results }}"
  # The plugin directory appearing is the change; "--activate" on an installed
  # plugin is a no-op that used to report changed on every run.
  args:
    creates: "/home/websites/{{ item.item.name }}/wp-content/plugins/disable-json-api"

- name: Disable XML-RPC
  become: true
  become_user: websites
  ansible.builtin.command:
    cmd: >-
      /home/websites/vendor/bin/wp plugin install disable-xml-rpc --activate
      --path=/home/websites/{{ item.item.name }}
  loop: "{{ webserver_wp_config.results }}"
  args:
    creates: "/home/websites/{{ item.item.name }}/wp-content/plugins/disable-xml-rpc"

- name: Install WordFence
  become: true
  become_user: websites
  ansible.builtin.command:
    cmd: >-
      /home/websites/vendor/bin/wp plugin install wordfence --activate
      --path=/home/websites/{{ item.item.name }}
  loop: "{{ webserver_wp_config.results }}"
  args:
    creates: "/home/websites/{{ item.item.name }}/wp-content/plugins/wordfence"

- name: Make sure that all web writable folders exist
  become: true
  become_user: websites
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    recurse: true
  loop: "{{ web_writable_folders }}"

- name: Set web_user ACL privileges on directories
  ansible.posix.acl:
    name: "{{ item }}"
    entity: "{{ nginx_user }}"
    etype: user
    permissions: rwx
    state: present
    recursive: true
  loop: "{{ web_writable_folders }}"

- name: Set web_user default ACL privileges on directories
  ansible.posix.acl:
    name: "{{ item }}"
    entity: "{{ nginx_user }}"
    etype: user
    permissions: rwx
    default: true
    state: present
    recursive: true
  loop: "{{ web_writable_folders }}"
