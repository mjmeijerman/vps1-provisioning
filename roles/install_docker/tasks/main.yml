---
# Docker for the application containers.
#
# From Docker's own repository rather than Debian's: the Debian `docker.io`
# package lags and ships an older compose, and the server needs `docker compose`
# (v2, a subcommand) because every project here uses it.
#
# The containers themselves are not managed by Ansible. What this role owns is
# the runtime and the things a deploy must never be allowed to create: the bind
# mounts that hold real data, and the checkouts a deploy resets.

- name: Install the packages apt needs to trust a third-party repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the Docker keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker's repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker Engine and the compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

# ---------------------------------------------------------------------------
# Host limits, before the daemon starts.
#
# The box has 2 GB and MariaDB plus several PHP pools already on it. Unbounded
# json-file logs are the classic way a small VPS fills its disk, and each
# container restart appends to the same file.
# ---------------------------------------------------------------------------
- name: Configure the Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  # Apply the daemon config before the first container exists.
  notify: Restart docker

# usermod, not the user module. The user module with `groups: docker` plus an
# explicit `append` is not enough here: the run that created the account also
# set www-data, and adding docker afterwards was silently a no-op on this box,
# leaving the group empty and every deploy failing on a socket permission
# error. usermod -aG is the operation that actually means "add, keep the rest".
- name: Let the listed users run Docker
  ansible.builtin.command:
    cmd: "usermod -aG docker {{ docker_user }}"
  register: install_docker_usermod
  changed_when: false
  loop: "{{ install_docker_users }}"
  loop_control:
    loop_var: docker_user

- name: Read the docker group members
  ansible.builtin.getent:
    database: group
    key: docker
  register: install_docker_group

- name: Fail when a listed user did not land in the docker group
  ansible.builtin.assert:
    that:
      - docker_user in install_docker_group.ansible_facts.getent_group['docker'][2].split(',')
    fail_msg: >-
      {{ docker_user }} is not in the docker group, so a deploy cannot reach the
      daemon. Check that the docker-ce package installed the group and that the
      user task ran before this point.
    quiet: true
  loop: "{{ install_docker_users }}"
  loop_control:
    loop_var: docker_user

# ---------------------------------------------------------------------------
# Swap
#
# 2 GB with a database is tight, and an OOM kill takes down MariaDB rather than
# the container that caused it.
# ---------------------------------------------------------------------------
- name: Check for a swap file
  ansible.builtin.stat:
    path: /swapfile
    # Without this the module hashes the file to report a checksum, and this
    # file is 2 GB: sha1sum of it takes eight seconds on this box, for a value
    # nothing reads.
    get_checksum: false
  register: install_docker_swapfile

- name: Create the swap file
  ansible.builtin.command:
    cmd: fallocate -l {{ install_docker_swap_size_mb }}M /swapfile
    creates: /swapfile
  when: not install_docker_swapfile.stat.exists

- name: Set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

# The file exists by now, whether this run created it or an earlier one did.
# Checking the signature is what makes both cases safe: mkswap on a live swap
# file destroys whatever is in it.
- name: Read the swap file's current signature
  ansible.builtin.command:
    cmd: /sbin/blkid -o value -s TYPE /swapfile
  register: install_docker_swapblkid
  changed_when: false
  failed_when: false

# /sbin is not on the PATH of a sudo shell here, so these are called by path.
- name: Read the active swap devices
  ansible.builtin.command:
    cmd: /sbin/swapon --show=NAME --noheadings
  register: install_docker_swapactive
  changed_when: false

- name: Format the swap file
  ansible.builtin.command:
    cmd: /sbin/mkswap /swapfile
  # Only when it is not already a swap area.
  when: install_docker_swapblkid.stdout != "swap"
  changed_when: true

- name: Enable the swap file now
  ansible.builtin.command:
    cmd: /sbin/swapon /swapfile
  # swapon on a file that is already active fails, and that is not an error.
  when: "'/swapfile' not in install_docker_swapactive.stdout"
  changed_when: true

- name: Keep the swap file across reboots
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: /swapfile none swap sw 0 0
    state: present

# ---------------------------------------------------------------------------
# One checkout and one data directory per application environment.
#
# A container runs as uid 1000, so the data directory is created with that owner
# here, at provisioning time. If Docker created it instead it would be
# root-owned, the app could not write its list, and the first signup would fail
# with a permission error nobody expects.
# ---------------------------------------------------------------------------
# The owner is a number, not a name: the image's uid 1000 has no user on the
# host, and a name that does not resolve leaves the directory with whatever
# owner it already had, which is how both data directories ended up owned by
# the provisioning user and unwritable by the container.
- name: Create a data directory per project
  ansible.builtin.file:
    path: "{{ item.data_dir }}"
    state: directory
    owner: "{{ install_docker_data_owner | int }}"
    group: "{{ install_docker_data_owner | int }}"
    mode: "{{ install_docker_data_mode }}"
  loop: "{{ install_docker_projects }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create an application directory per project
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ install_docker_users | first }}"
    group: "{{ install_docker_users | first }}"
    mode: "0755"
  loop: "{{ install_docker_projects }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check out the application repositories
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.path }}"
    version: "{{ item.version }}"
    # The deploy script owns what is checked out from here on. Ansible only
    # creates the checkout so the first deploy has somewhere to land; running
    # `update: true` here would fight the deploy for the same state.
    update: false
  become: true
  become_user: "{{ install_docker_users | first }}"
  loop: "{{ install_docker_projects }}"
  loop_control:
    label: "{{ item.name }}"
